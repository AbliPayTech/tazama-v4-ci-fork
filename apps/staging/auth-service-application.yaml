apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-service-staging
  namespace: argocd
spec:
  project: tazama
  source:
    repoURL: 'https://github.com/tazama-lf/cloud-infrastructure-deploy'
    targetRevision: dev
    path: k8s/overlays/staging/auth-service
    # Since kustomize is inferred by path ending in kustomization, no explicit kustomize block needed
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: tazama
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
