apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/tazama-lf/cloud-infrastructure-deploy'
    targetRevision: main
    path: apps/staging
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
