apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-service-integration-nats
spec:
  template:
    spec:
      containers:
        - name: relay-service-integration-nats
          envFrom:
            - configMapRef:
                name: tazama-app-config
            - secretRef:
                name: tazama-app-secrets
          env:
            - name: FUNCTION_NAME
              value: "relay-service-integration-nats"
            - name: APM_SERVICE_NAME
              value: "relay-service-integration-nats"
            - name: SIDECAR_HOST
              value: "event-sidecar.tazama.svc.cluster.local:5000"
