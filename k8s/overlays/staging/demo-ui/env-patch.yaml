apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-ui
spec:
  template:
    spec:
      containers:
        - name: demo-ui
          envFrom:
            - configMapRef:
                name: tazama-app-config
            - secretRef:
                name: tazama-app-secrets
          env:
            - name: FUNCTION_NAME
              value: demo-ui
            - name: APM_SERVICE_NAME
              value: demo-ui
            - name: SIDECAR_HOST
              value: event-sidecar.tazama.svc.cluster.local:5000
