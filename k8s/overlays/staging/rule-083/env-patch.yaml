apiVersion: apps/v1
kind: Deployment
metadata:
  name: rule-083
spec:
  template:
    spec:
      containers:
        - name: rule-083
          envFrom:
            - configMapRef:
                name: tazama-app-config
            - secretRef:
                name: tazama-app-secrets
          env:
            - name: FUNCTION_NAME
              value: "rule-083-rel-4-0-0"
            - name: RULE_VERSION
              value: "4.0.0"
            - name: RULE_NAME
              value: "083"
            - name: SUPPRESS_ALERTS
              value: "true"
            - name: SIDECAR_HOST
              value: "event-sidecar.tazama.svc.cluster.local:5000"
            - name: APM_SERVICE_NAME
              value: "rule-083"
            - name: LOCAL_CACHETTL
              value: "300"
            - name: LOCAL_CACHE_ENABLED
              value: "true"
