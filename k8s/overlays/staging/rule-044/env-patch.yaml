apiVersion: apps/v1
kind: Deployment
metadata:
  name: rule-044
spec:
  template:
    spec:
      containers:
        - name: rule-044
          envFrom:
            - configMapRef:
                name: tazama-app-config
            - secretRef:
                name: tazama-app-secrets
          env:
            - name: FUNCTION_NAME
              value: "rule-044-rel-4-0-0"
            - name: RULE_VERSION
              value: "4.0.0"
            - name: RULE_NAME
              value: "044"
            - name: SUPPRESS_ALERTS
              value: "true"
            - name: SIDECAR_HOST
              value: "event-sidecar.tazama.svc.cluster.local:5000"
            - name: APM_SERVICE_NAME
              value: "rule-044"
            - name: LOCAL_CACHETTL
              value: "300"
            - name: LOCAL_CACHE_ENABLED
              value: "true"
            - name: CONSUMER_STREAM
              value: "sub-rule-044-4-0-0"
            - name: PRODUCER_STREAM
              value: "pub-rule-044-4-0-0"
