apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-aggregation-decisioning-processor
spec:
  template:
    spec:
      containers:
        - name: transaction-aggregation-decisioning-processor
          envFrom:
            - configMapRef:
                name: tazama-app-config
            - secretRef:
                name: tazama-app-secrets
          env:
            - name: FUNCTION_NAME
              value: "transaction-aggregation-decisioning-processor"
            - name: APM_SERVICE_NAME
              value: "transaction-aggregation-decisioning-processor"
            - name: SIDECAR_HOST
              value: "event-sidecar.tazama.svc.cluster.local:5000"
            - name: SUPPRESS_ALERTS
              value: "true"
            - name: ALERT_PRODUCER
              value: "investigation-service"
            - name: ALERT_DESTINATION
              value: "investigation-service"
