# Injects common env config into all Tazama deployments.
# References tazama-app-config (ConfigMap) + tazama-app-secrets (Secret)
# created by Terraform in the tazama namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeholder
spec:
  template:
    spec:
      containers:
        - name: placeholder
          envFrom:
            - configMapRef:
                name: tazama-app-config
            - secretRef:
                name: tazama-app-secrets
