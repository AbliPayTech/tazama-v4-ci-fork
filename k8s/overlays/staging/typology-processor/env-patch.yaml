apiVersion: apps/v1
kind: Deployment
metadata:
  name: typology-processor
spec:
  template:
    spec:
      containers:
        - name: typology-processor
          envFrom:
            - configMapRef:
                name: tazama-app-config
            - secretRef:
                name: tazama-app-secrets
          env:
            - name: FUNCTION_NAME
              value: "typology-processor"
            - name: APM_SERVICE_NAME
              value: "typology-processor"
            - name: SIDECAR_HOST
              value: "event-sidecar.tazama.svc.cluster.local:5000"
            - name: CONSUMER_STREAM
              value: "typology-processor"
            - name: PRODUCER_STREAM
              value: "sub-rule-001-4.0.0"
            - name: INTERDICTION_PRODUCER
              value: "interdiction-service"
