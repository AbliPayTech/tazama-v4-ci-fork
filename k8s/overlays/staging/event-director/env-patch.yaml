apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-director
spec:
  template:
    spec:
      containers:
        - name: event-director
          envFrom:
            - configMapRef:
                name: tazama-app-config
            - secretRef:
                name: tazama-app-secrets
          env:
            - name: FUNCTION_NAME
              value: "event-director"
            - name: APM_SERVICE_NAME
              value: "event-director"
            - name: SIDECAR_HOST
              value: "event-sidecar.tazama.svc.cluster.local:5000"
            - name: CONSUMER_STREAM
              value: "event-director"
