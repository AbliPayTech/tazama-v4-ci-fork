# .github/workflows/terraform-plan.yml
name: Terraform Plan

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.stdout }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.7

      - name: Terraform init
        env:
          TF_VAR_github_token: ${{ secrets.GH_TOKEN }}   # if you use remote backend
        run: cd terraform-scripts/eks-terraform && terraform init

      - name: Terraform plan
        id: plan
        run: |
          cd terraform-scripts/eks-terraform && terraform plan -no-color -out=tfplan
          cd terraform-scripts/eks-terraform && terraform show -json tfplan > tfplan.json
          echo "stdout=$(cd terraform-scripts/eks-terraform && terraform show -no-color tfplan)" >> $GITHUB_OUTPUT

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('tfplan.json', 'utf8');
            const body = `## Terraform Plan\n\`\`\`diff\n${plan}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
