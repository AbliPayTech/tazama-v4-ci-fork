# .github/workflows/terraform-validate.yml
name: Terraform Validate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: write   # needed for comment posting

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.7   # pin to a known version

      - name: Terraform fmt (check)
        run: cd terraform-scripts/eks-terraform && terraform fmt -check -recursive

      - name: Terraform init
        run: cd terraform-scripts/eks-terraform && terraform init -backend=false   # no state needed for validate

      - name: Terraform validate
        id: validate
        run: cd terraform-scripts/eks-terraform &&  terraform validate -no-color

      - name: Post validation result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const output = `## Terraform Validate\n\n\`\`\`\n${{ steps.validate.outputs.stdout }}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
